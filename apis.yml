description: >-
  Burger King is one of the world's largest fast-food hamburger chains
  operating over 18,000 locations in more than 100 countries. Known for the
  flame-grilled Whopper, Burger King is a subsidiary of Restaurant Brands
  International (RBI) and operates the BK mobile app, Royal Perks loyalty
  program, and delivery partnerships with DoorDash, Uber Eats, and Grubhub.
