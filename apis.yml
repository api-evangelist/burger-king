apis:
  - aid: burger-king:bk-mobile-app
    name: Burger King Mobile App
    tags:
      - Mobile Ordering
      - Loyalty
      - Pickup
      - Delivery
    humanURL: https://www.bk.com/mobile-app
    properties:
      - url: https://www.bk.com/mobile-app
        type: Documentation
    description: >-
      The Burger King mobile app provides mobile ordering, in-store pickup,
      curbside pickup, and delivery via integration with DoorDash and other
      partners. Includes Royal Perks loyalty program access, digital coupons,
      and restaurant locator.

  - aid: burger-king:royal-perks
    name: Burger King Royal Perks
    tags:
      - Loyalty
      - Rewards
      - Mobile App
    humanURL: https://www.bk.com/rewards
    properties:
      - url: https://www.bk.com/rewards
        type: Documentation
    description: >-
      Royal Perks is Burger King's loyalty rewards program that earns members
      crowns for purchases that can be redeemed for menu items and exclusive
      offers. The program launched in 2021 and is accessed through the BK
      mobile app and website.

  - aid: burger-king:bk-online-ordering
    name: Burger King Online Ordering
    tags:
      - Online Ordering
      - Pickup
      - Delivery
    humanURL: https://www.bk.com/menu
    properties:
      - url: https://www.bk.com/menu
        type: Documentation
    description: >-
      Burger King's online ordering platform on bk.com lets customers place
      pickup, curbside, dine-in, and delivery orders directly through the
      web. Integrates with the same Royal Perks loyalty and payment surfaces
      as the mobile app.

  - aid: burger-king:bk-store-locator
    name: Burger King Store Locator
    tags:
      - Locations
      - Store Locator
      - Restaurant
    tags_raw:
      - Locations
      - Store Locator
      - Restaurants
    humanURL: https://www.bk.com/store-locator
    properties:
      - url: https://www.bk.com/store-locator
        type: Documentation
    description: >-
      Burger King's restaurant locator providing search by city, state,
      ZIP code, or geolocation to find the nearest restaurant locations,
      hours, services (drive-thru, delivery, dine-in), and contact details.
